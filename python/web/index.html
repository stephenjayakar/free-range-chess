<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Range Chess - RL Training Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .card h2 {
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .status-idle { background: #e0e0e0; color: #666; }
        .status-running { background: #4caf50; color: white; animation: pulse 2s infinite; }
        .status-stopped { background: #ff9800; color: white; }
        .status-completed { background: #2196f3; color: white; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: #f44336;
            color: white;
        }
        
        .btn-danger:hover {
            background: #da190b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }
        
        .btn-secondary {
            background: #9e9e9e;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #757575;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .info-label {
            color: #666;
            font-weight: 500;
        }
        
        .info-value {
            color: #333;
            font-weight: 600;
        }
        
        .log-container {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .model-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .model-item {
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        
        .model-item:hover {
            background: #f5f5f5;
            transform: translateX(5px);
        }
        
        .model-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .model-meta {
            font-size: 0.85em;
            color: #666;
        }
        
        .system-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .metric {
            padding: 15px;
            background: #f5f5f5;
            border-radius: 6px;
            text-align: center;
        }
        
        .metric-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .metric-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Free Range Chess - RL Training Dashboard</h1>
        
        <div id="alert" style="display: none;"></div>
        
        <div class="grid">
            <div class="card">
                <h2>Training Status</h2>
                <div class="status">
                    <span>Status:</span>
                    <span id="status-badge" class="status-badge status-idle">Idle</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Current Run:</span>
                    <span class="info-value" id="current-run">None</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Started:</span>
                    <span class="info-value" id="start-time">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">PID:</span>
                    <span class="info-value" id="pid">-</span>
                </div>
                <div style="margin-top: 20px;">
                    <button class="btn-danger" id="stop-btn" onclick="stopTraining()" disabled>Stop Training</button>
                    <button class="btn-secondary" onclick="refreshStatus()">Refresh</button>
                </div>
            </div>
            
            <div class="card">
                <h2>Start New Training</h2>
                <div class="form-group">
                    <label for="timesteps">Total Timesteps:</label>
                    <input type="number" id="timesteps" value="1000000" step="100000">
                </div>
                <div class="form-group">
                    <label for="n-envs">Parallel Environments:</label>
                    <input type="number" id="n-envs" value="8" min="1" max="32">
                </div>
                <div class="form-group">
                    <label for="opponent">Opponent Type:</label>
                    <select id="opponent">
                        <option value="random">Random</option>
                        <option value="greedy">Greedy</option>
                    </select>
                </div>
                <button class="btn-primary" id="start-btn" onclick="startTraining()">Start Training</button>
            </div>
            
            <div class="card">
                <h2>System Metrics</h2>
                <div class="system-metrics">
                    <div class="metric">
                        <div class="metric-value" id="cpu-percent">-</div>
                        <div class="metric-label">CPU Usage</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value" id="memory-percent">-</div>
                        <div class="metric-label">Memory Usage</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="grid">
            <div class="card">
                <h2>Training Log</h2>
                <div class="log-container" id="log-output">
                    No log available. Start training to see logs.
                </div>
            </div>
            
            <div class="card">
                <h2>Saved Models</h2>
                <div class="model-list" id="model-list">
                    Loading models...
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let refreshInterval;
        
        async function fetchAPI(endpoint, options = {}) {
            try {
                const response = await fetch(endpoint, options);
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Request failed');
                }
                return await response.json();
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
                throw error;
            }
        }
        
        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }
        
        async function refreshStatus() {
            try {
                const status = await fetchAPI('/api/status');
                
                const badge = document.getElementById('status-badge');
                badge.textContent = status.status.charAt(0).toUpperCase() + status.status.slice(1);
                badge.className = `status-badge status-${status.status}`;
                
                document.getElementById('current-run').textContent = status.current_run || 'None';
                document.getElementById('start-time').textContent = status.start_time || '-';
                document.getElementById('pid').textContent = status.pid || '-';
                
                const stopBtn = document.getElementById('stop-btn');
                const startBtn = document.getElementById('start-btn');
                
                if (status.status === 'running') {
                    stopBtn.disabled = false;
                    startBtn.disabled = true;
                    if (status.log_file) {
                        refreshLog();
                    }
                } else {
                    stopBtn.disabled = true;
                    startBtn.disabled = false;
                }
            } catch (error) {
                console.error('Failed to refresh status:', error);
            }
        }
        
        async function startTraining() {
            const config = {
                timesteps: parseInt(document.getElementById('timesteps').value),
                n_envs: parseInt(document.getElementById('n-envs').value),
                opponent: document.getElementById('opponent').value,
            };
            
            try {
                const result = await fetchAPI('/api/train/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config),
                });
                
                showAlert(`Training started: ${result.run_name}`, 'success');
                refreshStatus();
                startAutoRefresh();
            } catch (error) {
                console.error('Failed to start training:', error);
            }
        }
        
        async function stopTraining() {
            if (!confirm('Are you sure you want to stop training?')) {
                return;
            }
            
            try {
                await fetchAPI('/api/train/stop', { method: 'POST' });
                showAlert('Training stopped', 'success');
                refreshStatus();
                stopAutoRefresh();
            } catch (error) {
                console.error('Failed to stop training:', error);
            }
        }
        
        async function refreshLog() {
            try {
                const status = await fetchAPI('/api/status');
                if (!status.current_run) return;
                
                const logName = `${status.current_run}.log`;
                const logData = await fetchAPI(`/api/logs/${logName}?lines=50`);
                
                const logOutput = document.getElementById('log-output');
                logOutput.textContent = logData.lines.join('');
                logOutput.scrollTop = logOutput.scrollHeight;
            } catch (error) {
                console.error('Failed to refresh log:', error);
            }
        }
        
        async function refreshModels() {
            try {
                const models = await fetchAPI('/api/models');
                const modelList = document.getElementById('model-list');
                
                if (models.length === 0) {
                    modelList.innerHTML = '<p style="color: #666;">No models yet. Start training to create models.</p>';
                    return;
                }
                
                modelList.innerHTML = models.map(model => `
                    <div class="model-item">
                        <div class="model-name">${model.name}</div>
                        <div class="model-meta">
                            Created: ${new Date(model.created).toLocaleString()}<br>
                            Checkpoints: ${model.checkpoints}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to refresh models:', error);
            }
        }
        
        async function refreshSystemMetrics() {
            try {
                const metrics = await fetchAPI('/api/system');
                document.getElementById('cpu-percent').textContent = metrics.cpu_percent.toFixed(1) + '%';
                document.getElementById('memory-percent').textContent = metrics.memory_percent.toFixed(1) + '%';
            } catch (error) {
                console.error('Failed to refresh system metrics:', error);
            }
        }
        
        function startAutoRefresh() {
            if (refreshInterval) return;
            refreshInterval = setInterval(() => {
                refreshStatus();
                refreshSystemMetrics();
            }, 3000);
        }
        
        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }
        
        window.onload = async () => {
            await refreshStatus();
            await refreshModels();
            await refreshSystemMetrics();
            
            const status = await fetchAPI('/api/status');
            if (status.status === 'running') {
                startAutoRefresh();
            }
        };
    </script>
</body>
</html>
