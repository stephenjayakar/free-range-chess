<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Free Range Chess</title>
    <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <div class="main-content">
      <!-- Header -->
      <div class="header">
        <h1>♟ Free Range Chess</h1>
        <p class="tagline">A 10×10 chess variant — all pieces move each turn</p>
      </div>

      <!-- Game Info Bar -->
      <div class="game-info-bar">
        <div id="turnMessage" class="turn-indicator"></div>
        <div id="moveCount" class="move-counter">Move 1</div>
      </div>

      <!-- Status Message -->
      <div id="statusMessage"></div>

      <!-- Board -->
      <div class="board" id="board"></div>

      <!-- Captured Pieces -->
      <div class="captured-section">
        <div class="captured-tray">
          <span class="captured-label">♔ White captured:</span>
          <div id="capturedBlack" class="captured-pieces"></div>
        </div>
        <div class="captured-tray">
          <span class="captured-label">♚ Black captured:</span>
          <div id="capturedWhite" class="captured-pieces"></div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <div class="control-group">
          <button class="btn btn-primary btn-large" onclick="switchTurn()">⏭ End Turn</button>
          <button class="btn btn-secondary" onclick="newGame()">🔄 New Game</button>
        </div>
        <div class="control-group">
          <div class="ai-controls">
            <select id="aiSelector" class="ai-select">
              <option value="alphazero">🔮 AlphaZero AI</option>
              <option value="strategic">🧠 Strategic AI</option>
              <option value="aggressive">⚔ Aggressive AI</option>
              <option value="random">🎲 Random AI</option>
            </select>
            <button id="runAIBtn" class="btn btn-accent" onclick="runAI()">🤖 Run AI</button>
          </div>
        </div>
        <div class="control-group-secondary">
          <button id="toggleValidationBtn" class="btn btn-small btn-active" onclick="toggleValidation()">🛡 Validation: ON</button>
        </div>
      </div>
    </div>

    <!-- Log Panel -->
    <div class="log-panel">
      <div class="log-header">📋 Game Log</div>
      <div id="output" class="log-container"></div>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div id="gameOverOverlay" class="game-over-overlay">
    <div class="game-over-card">
      <div id="gameOverMessage" class="game-over-message"></div>
      <button class="btn btn-primary btn-large" onclick="newGame()">🔄 Play Again</button>
    </div>
  </div>

  <script type='module' src='./index.js'></script>
</body>
</html>
